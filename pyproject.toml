[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "0.2.1"
description = "Find the evaluation metric hiding in your router's input features."
readme = "leakcheck/README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["leakage", "contextual-bandit", "routing", "evaluation", "reproducibility"]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# Only the demo and the test suite need a learner; the detectors themselves are numpy-only.
demo = ["scikit-learn>=1.0"]
test = ["pytest>=7", "scikit-learn>=1.0"]

[tool.setuptools]
# Ship only the package. The surrounding repository is a research codebase, not part of it.
packages = ["leakcheck"]
